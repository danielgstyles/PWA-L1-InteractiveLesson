<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="pkt-title pkt-desc">
  <title id="pkt-title">The structure of a data packet</title>
  <desc id="pkt-desc">A packet drawn as three joined blocks: a header carrying source and destination IP addresses, the payload carrying the actual data, and a footer carrying error-checking information.</desc>
  <style>
    .lbl   { font-family: ui-monospace, Consolas, monospace; font-size: 15px; fill: #1A1208; font-weight: 700; }
    .sub   { font-family: system-ui, 'Segoe UI', sans-serif; font-size: 13px; fill: #1A1208; }
    .cap   { font-family: system-ui, 'Segoe UI', sans-serif; font-size: 13px; fill: #B8AA96; }
    .tag   { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #FFC940; letter-spacing: .08em; }
  </style>

  <text x="360" y="26" text-anchor="middle" class="tag">ONE DATA PACKET</text>

  <!-- header -->
  <rect x="30"  y="50" width="220" height="120" rx="6" fill="#FFC940"/>
  <text x="140" y="90"  text-anchor="middle" class="lbl">HEADER</text>
  <text x="140" y="116" text-anchor="middle" class="sub">Source IP address</text>
  <text x="140" y="136" text-anchor="middle" class="sub">Destination IP address</text>
  <text x="140" y="156" text-anchor="middle" class="sub">Sequence number</text>

  <!-- payload -->
  <rect x="250" y="50" width="250" height="120" fill="#5EE0A0"/>
  <text x="375" y="90"  text-anchor="middle" class="lbl">PAYLOAD</text>
  <text x="375" y="116" text-anchor="middle" class="sub">The actual data —</text>
  <text x="375" y="136" text-anchor="middle" class="sub">a slice of the message,</text>
  <text x="375" y="156" text-anchor="middle" class="sub">image or file being sent</text>

  <!-- footer -->
  <rect x="500" y="50" width="190" height="120" rx="6" fill="#C8ADFF"/>
  <text x="595" y="90"  text-anchor="middle" class="lbl">FOOTER</text>
  <text x="595" y="116" text-anchor="middle" class="sub">Marks the end</text>
  <text x="595" y="136" text-anchor="middle" class="sub">of the packet</text>
  <text x="595" y="156" text-anchor="middle" class="sub">Error checking</text>

  <text x="140" y="200" text-anchor="middle" class="cap">Where is it going?</text>
  <text x="375" y="200" text-anchor="middle" class="cap">What is being sent?</text>
  <text x="595" y="200" text-anchor="middle" class="cap">Did it arrive intact?</text>

  <text x="360" y="238" text-anchor="middle" class="cap">A large file is split into many of these. Each one travels on its own.</text>
</svg>
